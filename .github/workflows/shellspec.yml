name: shellspec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Merge queues remain unsupported by the central gatekeeper.
jobs:
  test:
    # Match the reusable job name while supplying GNU timeout explicitly.
    # Ubuntu 26.04 defaults to uutils, whose kill-after misses the group.
    name: test / ShellSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh and GNU timeout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
          version=$(/usr/bin/timeout --version)
          case "$version" in
            'timeout (GNU coreutils)'*) timeout_bin=/usr/bin/timeout ;;
            *)
              sudo apt-get install -y --no-install-recommends gnu-coreutils
              timeout_bin=/usr/bin/gnutimeout
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/gnu-bin"
          ln -s "$timeout_bin" "$RUNNER_TEMP/gnu-bin/gtimeout"
          version=$("$RUNNER_TEMP/gnu-bin/gtimeout" --version)
          case "$version" in
            'timeout (GNU coreutils)'*) ;;
            *) echo 'GNU timeout is required for the ShellSpec job' >&2; exit 1 ;;
          esac
          echo "$RUNNER_TEMP/gnu-bin" >> "$GITHUB_PATH"
      - name: Fetch pinned ShellSpec
        env:
          SHELLSPEC_SHA: 90e48c950239f3b8a9fdfa3e869592872c77b981 # 0.28.1
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/shellspec/shellspec/archive/${SHELLSPEC_SHA}.tar.gz" \
            --output "$RUNNER_TEMP/shellspec.tar.gz"
          mkdir -p "$RUNNER_TEMP/shellspec"
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/shellspec"
      - name: Run ShellSpec
        run: '"$RUNNER_TEMP/shellspec/shellspec" --format documentation'

  lint:
    # Syntax gate: `zsh -n` parses every zsh source without executing it.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
          zsh --version
      - name: Parse zsh files
        run: |
          mapfile -d '' files < <(
            find . -path ./.git -prune -o -type f \( \
              -name '*.zsh' -o -name '*.zsh-theme' -o -path '*/completions/_*' \
            \) -print0
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No zsh files found to check"
            exit 1
          fi
          failed=0
          for file in "${files[@]}"; do
            echo "Checking $file..."
            if ! zsh -n "$file" < /dev/null; then
              echo "::error file=$file::zsh -n failed"
              failed=1
            fi
          done
          echo "Checked ${#files[@]} file(s)."
          exit "$failed"
