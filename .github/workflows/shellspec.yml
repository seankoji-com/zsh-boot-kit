name: shellspec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Merge queues remain unsupported by the central gatekeeper.
# The pinned zero-input workflow uses GitHub-hosted Ubuntu, installs zsh, and
# honors this repository's .shellspec settings. Review that contract on updates.
jobs:
  test:
    uses: seankoji-com/.github/.github/workflows/reusable-shellspec.yml@dd88aa86a37bd8e3f7f3c036af63d88f8d35bb49

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Lint zsh files
        run: |
          find . -path ./.git -prune -o -type f \( -name '*.zsh' -o -name '*.zsh-theme' \) -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file..."
              zsh -n "$file" || exit 1
            done
