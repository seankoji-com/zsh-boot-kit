name: ShellSpec

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellspec:
    uses: seankoji-com/.github/.github/workflows/reusable-shellspec.yml@main

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Lint zsh files
        run: |
          find . -path ./.git -prune -o -type f \( -name '*.zsh' -o -name '*.zsh-theme' \) -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file..."
              zsh -n "$file" || exit 1
            done
