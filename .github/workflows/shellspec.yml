name: ShellSpec

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellspec:
    uses: seankoji-com/.github/.github/workflows/reusable-shellspec.yml@main

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint zsh files
        run: |
          for file in *.zsh lib/*.zsh completions/* 2>/dev/null; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              zsh -n "$file" || exit 1
            fi
          done
