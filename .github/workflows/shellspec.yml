name: shellspec

on:
  push:
  pull_request:

jobs:
  test:
    # GitHub-hosted, not the org's self-hosted runners: this repo is public and
    # a self-hosted runner would execute code from fork pull requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install shellspec
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run shellspec
        run: shellspec
